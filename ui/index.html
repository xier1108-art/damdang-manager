<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>담당사업 관리</title>
<script>
// 화면 테마를 CSS보다 먼저 정해 깜빡임을 막는다
(function () {
  var t = 'system';
  try { t = localStorage.getItem('dm-theme') || 'system'; } catch (e) {}
  var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="탐색">
    <div class="brand">
      <div class="logo"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg></div>
      <div><strong>담당사업 관리</strong><span>학교시설지원과</span></div>
    </div>
    <div class="side-sec">
      <span class="side-label">보기</span>
      <button type="button" class="nav-item" data-view="list"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>계약 목록</button>
      <button type="button" class="nav-item" data-view="calendar"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>캘린더</button>
      <button type="button" class="nav-item" data-view="timeline"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h10M8 12h12M4 18h7"/></svg>기간 타임라인</button>
    </div>
    <div class="side-sec">
      <span class="side-label">학교</span>
      <div id="schoolNav"></div>
    </div>
    <div class="side-foot">
      <div id="syncBox" class="sync-box"></div>
      <span id="saveState">불러오는 중…</span>
      <div class="seg theme-seg" role="group" aria-label="화면 테마">
        <button type="button" data-theme-set="system">시스템</button>
        <button type="button" data-theme-set="light">라이트</button>
        <button type="button" data-theme-set="dark">다크</button>
      </div>
      <button type="button" class="link-btn" id="btnSettings">설정 · 백업</button>
    </div>
  </nav>

  <main class="main">
    <header class="top">
      <div class="top-title">
        <h1 id="pageTitle">전체</h1>
        <span id="pageSub" class="muted"></span>
      </div>
      <label class="search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr">검색</span>
        <input id="q" type="search" placeholder="요약명, 계약명, 계약자, 계약번호 검색  (Ctrl+F)" autocomplete="off">
      </label>
      <button type="button" class="btn" id="btnExport"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>엑셀 내보내기</button>
      <button type="button" class="btn" id="btnAI" title="계약서 등 문서를 넣으면 Claude가 입력칸을 채웁니다 (창에 파일을 끌어 놓아도 됩니다)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 18v-6M9 15l3-3 3 3"/></svg>문서로 추가</button>
      <button type="button" class="btn primary" id="btnNew"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>새 계약</button>
    </header>

    <div class="body">
      <section class="content" id="content">
        <div class="kpis" id="kpis"></div>
        <div class="filters">
          <div class="seg" role="group" aria-label="상태" id="statusSeg"></div>
          <label class="sel">항목
            <select id="catSel"></select>
          </label>
          <label class="check" id="expandWrap"><input type="checkbox" id="expandAll">차수 펼쳐 보기</label>
          <label class="check" id="activeOnlyWrap" hidden><input type="checkbox" id="activeOnly" checked>진행 중만</label>
        </div>
        <div id="listView" class="card table-wrap"></div>
        <div id="timelineView" class="card tl-wrap" hidden></div>
        <div id="calendarView" class="card cal-wrap" hidden></div>
      </section>
      <aside class="detail" id="detail" aria-label="계약 상세" hidden></aside>
    </div>
  </main>
</div>

<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="drag-cover" aria-hidden="true"><div><svg viewBox="0 0 24 24" style="width:36px;height:36px"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 18v-6M9 15l3-3 3 3"/></svg><strong>놓으면 Claude가 읽어 새 계약으로 추가합니다</strong></div></div>

<script src="app.js"></script>
</body>
</html>
